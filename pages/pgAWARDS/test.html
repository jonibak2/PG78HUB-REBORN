<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comic Transition</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:transparent;
    overflow:hidden;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

#character{
    width:min(320px,40vw);
    opacity:0;
    transform:scale(0) rotate(0deg);
    position:relative;
    z-index:2;

    filter:
        drop-shadow(0 0 15px red)
        drop-shadow(0 0 45px crimson);

    user-select:none;
    pointer-events:none;
}
</style>

</head>
<body>

<!-- Заменить на свою картинку -->
<img id="character" src="undefined - Imgur.png">

<!-- Здесь потом можно поставить звук -->
<audio id="transitionSound" src="dragon-studio-simple-whoosh-382724.mp3"></audio>

<script>

const img = document.getElementById("character");
const sound = document.getElementById("transitionSound");

function playTransition(){

    img.getAnimations().forEach(a=>a.cancel());

    img.style.opacity = 0;
    img.style.transform = "scale(0) rotate(0deg)";
    img.style.display = "block";

    if(sound.src){
        sound.currentTime = 0;
        sound.play().catch(()=>{});
    }

    img.animate([
        {
            transform:"scale(0) rotate(0deg)",
            opacity:0
        },
        {
            transform:"scale(.25) rotate(720deg)",
            opacity:1,
            offset:.12
        },
        {
            transform:"scale(.7) rotate(2160deg)",
            opacity:1,
            offset:.42
        },
        {
            transform:"scale(1.25) rotate(4320deg)",
            opacity:1,
            offset:.78
        },
        {
            transform:"scale(2.8) rotate(6480deg)",
            opacity:1,
            offset:.9
        },
        {
            transform:"scale(3.4) rotate(6480deg)",
            opacity:0
        }
    ],{
        duration:1100,
        easing:"cubic-bezier(.15,.9,.25,1)",
        fill:"forwards"
    }).onfinish = () => {
        img.style.display = "none";
    };

}

window.onload=()=>{
    setTimeout(playTransition,150);
};

// Клик — повторить анимацию
document.addEventListener("click",playTransition);

</script>

</body>
</html>
