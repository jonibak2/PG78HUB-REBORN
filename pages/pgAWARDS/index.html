      <button class="year-tab" data-year="25">PGA25</button>

    <a href="#categories" class="btn btn-primary btn-vote-header">
      <span>ГОЛОСОВАТЬ</span>

      <span>ГОЛОСОВАТЬ</span>
    </a>
  </nav>
</header>

<main id="top">

  <!-- ============ HERO ============ -->
  <section class="hero reveal">
    <div class="hero-inner">
      <div class="hero-left">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 class="hero-title" id="heroTitle">PGA26</h1>
      </div>

    </div>
  </section>

  <!-- ============ TOP VIDEO SECTION ============ -->
  <section class="video-section reveal">
    <div class="video-wrap">
      <p class="video-caption" id="topVideoCaption">Откат года</p>
      <div class="video-frame">
        <video class="video-player" id="topVideo" controls preload="metadata" playsinline>
          <source id="topVideoSource" src="assets/pgAWARDS25/goda.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </section>

  <!-- ============ FEATURED CATEGORIES ============ -->
  <section class="featured-section" id="categories">
    <div class="section-head reveal">
      <p class="eyebrow">Основные номинации</p>

    </div>

    <div class="featured-grid" id="featuredContent"></div>
  </section>

  <!-- ============ MAIN CATEGORIES GRID ============ -->
  <section class="main-categories-section">
    <div class="section-head reveal">
      <p class="eyebrow">Все номинации</p>
      <h2 class="section-title" id="categoriesTitle">Номинации</h2>
    </div>

    <div class="year-content reveal" id="yearContent"></div>
  </section>

  <!-- ============ BOTTOM VIDEO SECTION ============ -->
  <section class="video-section video-section--bottom reveal">
    <div class="section-head reveal ceremony-head">
      <p class="eyebrow">Церемония</p>
      <h2 class="section-title ceremony-title" id="ceremonyTitle">❤🖤❤</h2>
    </div>
    <div class="video-wrap">
      <div class="movie-player-wrap" id="ceremonyMediaWrap">
        <video class="movie-player" controls preload="metadata" playsinline>
          <source src="assets/pgAWARDS23/happynewyear.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </section>

</main>
